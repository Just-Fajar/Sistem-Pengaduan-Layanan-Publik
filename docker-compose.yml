services:
  mysql:
    image: mysql:8.0
    container_name: pengaduan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pengaduan_layanan
      MYSQL_USER: user
      MYSQL_PASSWORD: password123
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pengaduan-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: "development"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "user"
      DB_PASSWORD: "password123"
      DB_NAME: "pengaduan_layanan"
      JWT_SECRET: "dev_jwt_secret_key_at_least_32_characters_long"
      JWT_EXPIRE_HOURS: "24"
      ALLOWED_ORIGIN: "http://localhost:3000,http://localhost"
      UPLOAD_DIR: "./uploads"
      MAX_FILE_SIZE: "5242880"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pengaduan-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  app-network:
    driver: bridge
